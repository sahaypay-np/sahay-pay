<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="Sahay Pay — Small acts. Real help. People in Nepal and India post bills they need help with; others help directly. Sahay Pay never holds gift money.">
<title>Sahay Pay — Small acts. Real help.</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><i class="orb orb-a"></i><i class="orb orb-b"></i><i class="orb orb-c"></i></div>
<header id="topbar" class="topbar glass" hidden>
  <a class="brand" href="#/swipe" aria-label="Sahay Pay home">
    <span class="logo-mark" aria-hidden="true">S</span>
    <span class="brand-text"><strong>Sahay Pay</strong><small data-i18n="tagline">Small acts. Real help.</small></span>
  </a>
  <div class="topbar-right">
    <span id="country-chip" class="chip country-chip" hidden></span>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">◐</button>
    <button id="bell-btn" class="icon-btn bell" type="button" aria-label="Notifications">🔔<span id="bell-badge" class="badge-dot" hidden>0</span></button>
    <button id="avatar-btn" class="avatar-btn" type="button" aria-label="Profile and settings"><span id="avatar-initial">?</span></button>
  </div>
</header>
<main id="view" class="view" aria-live="polite"></main>
<nav id="dock" class="dock glass" hidden aria-label="Main navigation">
  <a href="#/swipe" data-tab="swipe" class="dock-tab"><span class="dock-ic">🔥</span><span data-i18n="tab_swipe">Swipe</span></a>
  <a href="#/post" data-tab="post" class="dock-tab dock-tab-plus"><span class="dock-ic">＋</span><span data-i18n="tab_post">Post</span></a>
  <a href="#/leaders" data-tab="leaders" class="dock-tab"><span class="dock-ic">🏆</span><span data-i18n="tab_leaders">Leaders</span></a>
  <a href="#/brands" data-tab="brands" class="dock-tab"><span class="dock-ic">🏷️</span><span data-i18n="tab_brands">Brands</span></a>
  <a href="#/mybills" data-tab="mybills" class="dock-tab"><span class="dock-ic">📁</span><span data-i18n="tab_mybills">My Bills</span></a>
</nav>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="assertive"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
