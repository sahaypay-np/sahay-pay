{"@type":"Question","name":"Does Sahay Pay take a cut of my help?","acceptedAnswer":{"@type":"Answer","text":"In zero-fee mode, no — 100% of your help goes to the person. If the supporter-fee model is ever live, the fee is shown in full on the Check step before you send anything. Charity requests are always fee-free."}},
{"@type":"Question","name":"What does Demo Mode mean?","acceptedAnswer":{"@type":"Answer","text":"No real payment integration is connected yet. You send money yourself in your own payment app; Sahay Pay only records what you and the recipient confirm. No screen ever claims a real payment succeeded."}},
{"@type":"Question","name":"What do the verification badges mean?","acceptedAnswer":{"@type":"Answer","text":"Bill Verified: a human reviewer checked the private bill proof matches the post. ID Verified: a reviewer checked an ID photo and the name matches the bill. Name Verified: a reviewer confirmed the name on the bill matches the payout account. All checks are done by a person, never automatically."}},
{"@type":"Question","name":"Can a gift be refunded?","acceptedAnswer":{"@type":"Answer","text":"Gifts are voluntary and go directly from you to the person, outside Sahay Pay — Sahay Pay cannot refund or reverse them. Only report a problem if the details were wrong or the post was fake; the owner reviews every report."}},
{"@type":"Question","name":"I lost my session — what happens?","acceptedAnswer":{"@type":"Answer","text":"There is no email or password, so a lost or expired session means creating a fresh profile with the simple questions. Your old posts stay linked to your old profile."}},
{"@type":"Question","name":"Who approves posts?","acceptedAnswer":{"@type":"Answer","text":"The owner of Sahay Pay personally approves every post, brand ask and auction before it goes public. AI can flag things; AI can never approve."}}
]}
