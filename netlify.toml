# Sahay Pay — Netlify deploy config.
# Static SPA served from public/ by the CDN; the Express app runs as a
# Function (netlify/functions/api.js) for /api/* and uploaded files.
# No build step.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # The function loads its SQL schema at runtime (see server/db.js); ship
  # the schema files into the bundle (they land at <bundle>/server/).
  included_files = ["server/schema.postgres.sql", "server/schema.sqlite.sql"]

# Security headers for every static response (checklist items 8–12).
# NOTE: the SPA uses inline onclick handlers + inline styles, so the CSP
# must keep 'unsafe-inline' for script-src and style-src or the app breaks.
# These headers apply to CDN-served files; /api/* responses come from the
# Express function (which disables X-Powered-By in server/index.js).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

# API + uploaded files go to the Express function. The original path is
# kept after the function prefix so the wrapper can restore it whichever
# path form Netlify passes in event.path.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/public/*"
  to = "/.netlify/functions/api/uploads/public/:splat"
  status = 200

# Shareable OG pages (/share/*) come from the Express function too — the
# SPA fallback would serve index.html without OG meta for crawlers.
[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/api/share/:splat"
  status = 200

# Everything else is the SPA (hash-routed; static files in public/ are
# served directly before this rule).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
